# AetherOS 持续集成。
#
# 2026-10-24 重构原因：此前的单一 job 把「全量门禁」放在最前面，而全量门禁里的
# 像素/布局/性能检查依赖字体、显示环境与稳定帧时间；GitHub 托管 runner 上这些
# 条件不成立，于是两个平台都在第一步就红，后面的 Linux 专属 `cargo test` 永远
# 被跳过。结果就是：CI 看起来存在，但 Linux 分支从未真正被验证。
#
# 现在的分工：
#   * fast  —— 秒级文档/站点/链接/纯函数门禁，两个平台都跑；
#   * test  —— 编译 + 单元测试，两个平台都跑；Ubuntu 上的 `cargo test` 就是
#              `#[cfg(unix)]` / `#[cfg(target_os = "linux")]` 分支的真实执行入口；
#   * 全量像素/性能门禁留在构建机或自托管 runner，见 docs/证据/CI诊断-2026-10-24.md。
name: CI

# Windows runner 的默认控制台编码不是 UTF-8；门禁脚本里有中文与符号，
# 不显式设置会在 print 时抛 UnicodeEncodeError（2026-10-31 实测）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: 快速门禁（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 跑快速门禁
        shell: bash
        run: |
          set -o pipefail
          if ! python scripts/gates.py --fast --log-dir fast-logs 2>&1 | tee fast.log; then
            grep -E "FAIL|门禁未通过|Traceback|Error" fast.log | tail -n 40 | while IFS= read -r line; do
              echo "::error title=fast-gate::$line"
            done
            grep -hE "FAIL|门禁未通过|Traceback|Error|error:" fast-logs/*.log 2>/dev/null | tail -n 40 | while IFS= read -r line; do
              echo "::error title=fast-gate-log::$line"
            done
            grep -hE "^ +- |^\[FAIL\]" fast-logs/*.log 2>/dev/null | tail -n 30 | while IFS= read -r line; do
              echo "::error title=fast-gate-detail::$line"
            done
            tail -n 20 fast.log | while IFS= read -r line; do
              echo "::error title=fast-gate-tail::$line"
            done
            exit 1
          fi

  test:
    name: 编译与测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # 仓库的 Windows 开发路径是 GNU（.cargo/config.toml 配 rust-lld + 自包含 mingw），
    # 不是 MSVC。CI 必须用同一条链路，否则会在测试里得到与开发机不同的行为。
    # 用 matrix 显式带 toolchain：`runner` 上下文在 job 级 env 不可用（会被判为无效 workflow）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_toolchain: stable
          - os: windows-latest
            rust_toolchain: stable-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust_toolchain }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # minifb 在 Linux 上需要 X11 / xkbcommon 开发库；缺了会在 `cargo build` 阶段
      # 直接失败，而不是等到运行时。Ubuntu runner 默认不保证这些包存在。
      - name: 安装 Linux 图形构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev

      - name: 编译全部目标（--locked）
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
        run: |
          set -o pipefail
          if ! cargo build --workspace --all-targets --locked 2>&1 | tee build.log; then
            # 把失败摘要回写成 check annotation：公开仓库的 job 日志下载需要管理员权限，
            # 但 annotation 可读。这样下一次红的时候不用再猜。
            grep -E "error(\[|:)|panicked|warning:" build.log | tail -n 60 | while IFS= read -r line; do
              echo "::error title=cargo-build::$line"
            done
            tail -n 20 build.log | while IFS= read -r line; do
              echo "::error title=cargo-build-tail::$line"
            done
            free -h || true
            df -h || true
            exit 1
          fi

      # 这一步在 Ubuntu 上会真正执行 `cfg(unix)` / `cfg(target_os = "linux")` 分支；
      # 在 Windows 上则执行 Windows 分支。两个平台的结果都必须绿。
      - name: 单元测试（--locked）
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
        run: |
          set -o pipefail
          if ! cargo test --workspace --locked 2>&1 | tee test.log; then
            grep -E "FAILED|panicked|^error|test result: FAILED" test.log | tail -n 30 | while IFS= read -r line; do
              echo "::error title=cargo-test::$line"
            done
            tail -n 20 test.log | while IFS= read -r line; do
              echo "::error title=cargo-test-tail::$line"
            done
            exit 1
          fi
