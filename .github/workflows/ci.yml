# AetherOS 持续集成：把"只有开发机上跑得起来"的门禁搬到 Linux 上真的跑一遍。
#
# 为什么必须有（2026-10-02 安全审计 D.2 第 18 条）：
#   * 开发机是 Windows，**所有 `#[cfg(unix)]` / `#[cfg(target_os = "linux")]` 的用例
#     在那边根本不执行**，却一直被当作"已验证"；
#   * `cargo test`、`repo-stats.py --check`、`gen-site.py --check` 全靠人记得跑；
#   * musl 交叉编译只有 6/7 crate 能在开发机查（aetherd 需要 x86_64-linux-musl-gcc）。
#
# ⚠️ 诚实提示：**这份工作流在本地无法验证**（没有 GitHub 运行器）。
#    第一次真正跑起来时，Linux 侧可能立刻红 —— 那正是它的价值：
#    把这些年"从没被执行过"的断言暴露出来，而不是继续当作已验证。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: 门禁（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    # 挂住的 job 会白烧默认 360 分钟（代码审查指出没设上限）：门禁本身最多几分钟，
    # 30 分钟足够跑完（首次构建含依赖编译）。
    timeout-minutes: 30
    strategy:
      fail-fast: false          # 两个平台各自出结论，一个红不代表另一个也红
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # musl 目标用于"Linux 目标能否编译"的静态检查（不改链接器，ring 那类
          # 需要 C 交叉工具链的 crate 会在 CI 上暴露出来）
          targets: x86_64-unknown-linux-musl

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Windows 上缺 MSVC，仓库用 rust-lld + 自包含 mingw 运行库（见 .cargo/config.toml），
      # 因此不需要额外装工具链。
      - name: 跑全部门禁
        run: python scripts/gates.py --online

      # Linux 专属断言在这里**真的执行**（Windows 任务里会被跳过）。
      - name: Linux 专属用例（unix/linux 分支）
        if: runner.os == 'Linux'
        run: cargo test --workspace -- --nocapture
