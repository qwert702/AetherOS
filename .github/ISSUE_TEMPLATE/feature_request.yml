name: Feature request
description: 提出可验收的功能建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先确认这不是 [路线图](https://github.com/qwert702/AetherOS/blob/main/docs/路线图与已知缺口（ROADMAP）-2026-09-05.md)
        或 [功能缺口清单](https://github.com/qwert702/AetherOS/blob/main/docs/报告/功能缺口清单（FEATURE-GAPS）-2026-10-02.md)
        里已经明确“不做”的项目。

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述用户场景，不要先写实现方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以写多个方案与取舍
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎样才算完成？要能复跑/能看到证据
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 不做的理由

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 和路线图
          required: true
