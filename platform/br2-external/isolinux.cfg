DEFAULT aether

LABEL aether
  KERNEL /boot/bzImage
  APPEND console=tty0 console=ttyS0,115200n8

# 自动安装项（2026-10-15，P0）：把系统无人值守装到最大的一块固定盘上。
# 平时**不是**默认项；要做"挂上 ISO 一开机就装完"的自动安装版镜像，用
#   AETHER_AUTOINSTALL=1 platform/build-iso.sh
# 构建脚本会把上面的 DEFAULT 临时改成 autoinstall 并在退出时还原（trap）。
LABEL autoinstall
  KERNEL /boot/bzImage
  APPEND console=tty0 console=ttyS0,115200n8 aether.autoinstall=1

PROMPT 0
TIMEOUT 20
