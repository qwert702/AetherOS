[workspace]
resolver = "2"
members = [
    "aether-ipc",
    "aether-compositor",
    "aether-shell",
    "aetherd",
    "aether-ops",
    "aether-init",
    "aether-install",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/qwert702/AetherOS"
authors = ["AetherOS Project"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
# 去掉符号表（2026-10-02 审计 L-4）：镜像里的特权二进制此前保留 `.symtab`，
# 等于把内部函数名、类型名、panic 位置一并交给任何能读到二进制的人 ——
# 对攻击者是免费的逆向材料，对我们没有任何运行期价值。
# 代价：线上崩溃只能靠 `debug` 版复现（`.debug_*` 段本来就没进 release）。
# panic 消息本身不受影响（它用的是编译期字符串，不是符号表）。
strip = "symbols"

# 软件光栅化是计算密集型：dev 构建不开优化会卡成幻灯片。
# opt-level=2 让日常 cargo run 接近 release 流畅度，同时保留快速编译。
[profile.dev]
opt-level = 2
debug = "line-tables-only"
