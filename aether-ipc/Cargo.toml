[package]
name = "aether-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AetherOS IPC 协议：UI、AI 中枢与系统服务之间的统一通信脊柱"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# 只给 Linux 目标加：`SO_PEERCRED` 是 Linux 的接口（macOS 用 LOCAL_PEERCRED，语义不同）。
# 为什么需要它：`UnixStream::peer_cred()` 在 rustc 1.98 上**仍未稳定**
# （unstable feature `peer_credentials_unix_socket`），而 musl 静态检查会把
# "Windows 编译不到、Linux 编译不过"的代码当场抓出来（这次就抓到了）。
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
