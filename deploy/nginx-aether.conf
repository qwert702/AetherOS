# AetherOS 官网 nginx 配置
#
# 用法（部署脚本 scripts/deploy-site.py 会自动装到 /etc/nginx/sites-available/ 并 enable）：
#   certbot --nginx -d aether.cbnac.com          # 首次签发证书（会自动往本文件里插 443 段）
#
# 设计要点：
#   - 站点是**纯静态**：不跑任何后端，不吃内存，被扫也不怕
#   - 图片长缓存、HTML 短缓存：改版后不会有人卡在旧页面
#   - 安全头全给：CSP 允许内联 style（页面里没有内联脚本，只有内联 style 与 JSON-LD）
#   - 下载不落在本机：ISO 走 GitHub Releases + Cloudflare R2，VPS 不承担大文件流量

server {
    listen 80;
    listen [::]:80;
    server_name aether.cbnac.com;

    root /var/www/aether.cbnac.com;
    index index.html;

    # certbot 的 ACME 校验目录必须放行
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # 其余一律跳 HTTPS（证书签好后由 certbot 插入 443 段，这里保持跳转）
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aether.cbnac.com;

    root /var/www/aether.cbnac.com;
    index index.html;

    # 证书由 certbot 管理（首次签发后这两行由 certbot 写入；此处为占位说明）
    # ssl_certificate     /etc/letsencrypt/live/aether.cbnac.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/aether.cbnac.com/privkey.pem;

    charset utf-8;
    server_tokens off;

    # —— 安全头 ——
    # 页面没有内联 <script>（JSON-LD 是 application/ld+json，不受 script-src 限制），
    # 所以 CSP 可以收紧到 self；style 需要 unsafe-inline（页面里有少量内联样式）。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # —— 缓存策略 ——
    # 图片/字体：长缓存（文件名带版本或内容稳定）
    location /assets/img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }
    location ~* \.(css|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    # HTML：短缓存，保证改版立刻可见
    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600, must-revalidate";
    }

    location = /sitemap.xml { access_log off; }
    location = /robots.txt  { access_log off; }

    # 404 用站点自己的页面
    error_page 404 /404.html;

    # 隐藏文件与仓库文件不该被访问
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(md|rs|toml|py|sh|json)$ { deny all; }
}
