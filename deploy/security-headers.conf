# AetherOS 安全响应头 —— 单一来源片段
#
# **为什么必须是片段、而不是散在各处**（2026-10-02 安全审计 M-10）：
# nginx 的 `add_header` 继承规则是"**当前层级一旦有 add_header，上一层的全部
# add_header 都不继承**"。原配置在 server 级写了 5 条安全头，而
# `location /assets/img/`、`location ~* \.(css|svg|woff2?)$`、`location ~* \.html$`
# 各自又写了 `add_header Cache-Control` —— 于是这三类响应（**包含所有 HTML 页面**）
# 的 CSP / HSTS / X-Content-Type-Options / Referrer-Policy / Permissions-Policy
# 全部静默丢失。配置"看起来已加固"，线上却没有。
#
# 解法：安全头只在这里维护一份，在**每个带 add_header 的层级**都 `include` 一次。
# `include` 不受上述继承规则限制。
#
# 关于 HSTS 与 80 端口：本片段含 `Strict-Transport-Security`。浏览器按 RFC 6797
# 只在**安全传输**上接受该头，所以放在同时服务 HTTP 的 server 里是安全的
# （明文响应上的 HSTS 会被忽略），因此 HTTP / HTTPS 共用同一份片段，不做拆分。

add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
