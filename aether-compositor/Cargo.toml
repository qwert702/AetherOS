[package]
name = "aether-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AetherOS 自研 Wayland 合成器"

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
fontdue = "0.9"
aether-ipc = { path = "../aether-ipc" }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Windows/Linux 桌面主机的渲染预览后端（M1 开发迭代用）。
# musl 静态编译（ISO rootfs）只需 fbdev 路径，minifb 的 X11 链接不可用，
# 故排除 musl target。
[target.'cfg(all(not(target_os = "linux"), not(target_env = "musl")))'.dependencies]
minifb = "0.27"

[target.'cfg(unix)'.dependencies]
# Wayland 合成器后端在 Linux/WSL2 上启用（M1 后期接入 smithay）
# smithay = { version = "0.5", features = ["backend_winit"] }
